name: Tag release

# One-click release. The owner runs Actions -> Tag release on `main` and picks the bump (patch by default).
# This workflow checks the head of main (lint, typecheck, tests), computes the next version from the highest stable
# `v*` tag (or takes the exact `version` input) and pushes only the tag `vX.Y.Z`. It never commits to `main`, which
# the `main` ruleset protects. It then dispatches `release.yml` on the tag, which stamps the version into
# package.json in its build workspace, builds, signs and notarises macOS, signs update.json and publishes the
# GitHub Release. `main` keeps the placeholder version 0.0.0 (see docs/releases.md).
#
# A push made with GITHUB_TOKEN does not start the `push: tags` trigger of release.yml (GitHub blocks recursive
# triggers), so the tag run is started with a dispatch on the tag ref instead.
#
# Every input reaches a script through `env:` only; no expression is interpolated into a `run:` script.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead of the bump, for example 1.0.0 (optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm exec biome check --error-on-warnings .
          pnpm typecheck
          pnpm test

      - name: Compute version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          sh .github/scripts/next-version-test.sh
          version=$(git tag -l 'v*' | sh .github/scripts/next-version.sh "$BUMP" "$VERSION")
          echo "tag=v$version" >>"$GITHUB_OUTPUT"

      - name: Tag and push
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Dispatch Release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          {
            echo "## Tag release $TAG"
            echo "Commit: $(git rev-parse "$TAG^{commit}")"
            echo "Release run: https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
          } >>"$GITHUB_STEP_SUMMARY"
